spring:
  application:
    name: fixit-admin
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fixit}
    username: ${DB_USERNAME:fixit}
    password: ${DB_PASSWORD:fixit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api/v1
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-ttl: 15m
      refresh-ttl: 7d
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    type: local
    local-root: ${STORAGE_PATH:./data/files}
